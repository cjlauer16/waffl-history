name: Update Current Season

on:
  schedule:
    # Wednesdays 13:17 UTC (8:17 AM ET in winter) — after MNF and Tuesday stat corrections
    - cron: '17 13 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-html-writer
  cancel-in-progress: false

jobs:
  update-current-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest Sleeper data into index.html
        run: python scripts/update_current_season.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html"
          else
            git commit -m "Current season: update from Sleeper [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
