}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
code{background:#1e2840;padding:.15em .45em;border-radius:4px;font-family:monospace;font-size:.88em}

/* Header */
.site-header{background:#141824;border-bottom:1px solid var(--border);padding:1.25rem 2rem 0;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:baseline;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.league-title{font-size:1.55rem;font-weight:800;color:var(--gold);letter-spacing:-.5px}
.generated-at{color:var(--muted);font-size:.75rem}
.tabs{display:flex;overflow-x:auto;gap:0;padding-bottom:0}
.tab-btn{padding:.65rem 1.2rem;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;font-size:.9rem;font-weight:500;white-space:nowrap;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Layout */
.content{max-width:1200px;margin:0 auto;padding:2rem}
.section{margin-bottom:2.5rem}
.section-title{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:2.5rem}

/* Champion banner */
.champion-banner{background:linear-gradient(135deg,#2a1f0a,#1a1208);border:1px solid var(--gold);border-radius:12px;padding:1.5rem 2rem;margin-bottom:2rem;display:flex;align-items:center;gap:1.5rem}
.champion-trophy{font-size:2.8rem}
.champion-label{color:var(--gold);font-size:.75rem;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.champion-name{font-size:1.75rem;font-weight:800;color:var(--gold)}
.champion-sub{color:var(--muted);font-size:.88rem;margin-top:.3rem}

/* Quick stats */
.quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.2rem 1.5rem}
.stat-label{color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem}
.stat-value{font-size:1.55rem;font-weight:700}
.stat-sub{color:var(--muted);font-size:.78rem;margin-top:.2rem}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:.88rem}
thead th{color:var(--muted);font-weight:600;font-size:.73rem;text-transform:uppercase;letter-spacing:.5px;padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{color:var(--text)}
thead th.sort-asc::after{content:' ▲';font-size:.65rem}
thead th.sort-desc::after{content:' ▼';font-size:.65rem}
tbody tr{border-bottom:1px solid #1e2433;transition:background .1s}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:.65rem .8rem}
.rank-cell{color:var(--muted);font-weight:700;width:2.5rem}
.team-cell{font-weight:600}

/* Finish colors */
.f-champ{color:var(--gold);font-weight:700}
.f-runner{color:var(--silver);font-weight:600}
.f-third{color:var(--bronze);font-weight:600}
.f-made{color:var(--accent)}
.f-missed{color:var(--muted)}
.f-last{color:var(--red)}

/* Highlights */
.highlights-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}
.highlight-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
.highlight-icon{font-size:1.4rem;margin-bottom:.5rem}
.highlight-type{color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.3rem}
.highlight-main{font-size:.97rem;font-weight:700;margin-bottom:.25rem}
.highlight-detail{color:var(--muted);font-size:.83rem}

/* Playoff bracket */
.bracket-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.bracket-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
.bracket-card-title{font-weight:700;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.9rem}
.place-row{display:flex;align-items:center;gap:.7rem;padding:.45rem 0;border-bottom:1px solid var(--border)}
.place-row:last-child{border:none}
.place-icon{font-size:1.1rem;width:1.8rem;text-align:center}
.place-label{color:var(--muted);font-size:.78rem;width:7rem}
.place-name{font-weight:600}

.eff-good{color:var(--green)}
.eff-bad{color:var(--red)}
.mis-zero{color:var(--green)}
.mis-some{color:var(--gold)}
.mis-many{color:var(--red)}
.pf-pos{color:var(--green)}
.pf-neg{color:var(--red)}
.table-hint{color:var(--muted);font-size:.72rem;margin-top:.5rem;font-style:italic}

/* AI recap */
.ai-card{background:linear-gradient(135deg,#1a2035,#151c2e);border:1px solid #3040a0;border-radius:10px;overflow:hidden}
.ai-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;cursor:pointer;background:rgba(79,156,249,.05)}
.ai-header:hover{background:rgba(79,156,249,.1)}
.ai-header-title{font-weight:700;color:var(--accent);display:flex;align-items:center;gap:.5rem;font-size:.93rem}
.ai-toggle{color:var(--muted);font-size:.78rem}
.ai-body{padding:1.5rem;border-top:1px solid #3040a0;display:none}
.ai-body.open{display:block}
.ai-text{color:#c8d0e0;line-height:1.8;font-size:.9rem}
.ai-text h1,.ai-text h2,.ai-text h3{color:var(--accent);margin:1.2rem 0 .4rem;font-size:1rem;letter-spacing:.04em;text-transform:uppercase}
.ai-text h1{font-size:1.1rem;border-bottom:1px solid #3040a0;padding-bottom:.3rem}
.ai-text p{margin:.3rem 0}
.ai-text ul,.ai-text ol{margin:.4rem 0 .4rem 1.4rem;padding:0}
.ai-text li{margin:.2rem 0}
.ai-text strong{color:#e8eaf6;font-weight:700}
.ai-text em{color:#b0c4de;font-style:italic}
.ai-text code{background:#0d1117;padding:.1em .35em;border-radius:3px;font-size:.82rem;color:#79b8ff}
.ai-text hr{border:none;border-top:1px solid #3040a0;margin:1rem 0}
.ai-text br{display:block;margin:.2rem 0;content:""}
.ai-hint{color:var(--muted);font-size:.73rem;margin-top:1rem;font-style:italic}

/* Blog */
.blog-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.25rem 1.5rem;margin-bottom:1rem;cursor:pointer;transition:border-color .15s,transform .15s}
.blog-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.blog-card-title{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:.2rem}
.blog-card-meta{color:var(--muted);font-size:.78rem;margin-bottom:.6rem}
.blog-card-preview{color:var(--muted);font-size:.85rem;line-height:1.55}
.blog-post-title{font-size:1.5rem;font-weight:800;color:var(--text);margin:0 0 .4rem}
.blog-post-meta{color:var(--muted);font-size:.82rem;margin-bottom:1.4rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.back-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:.35rem .85rem;border-radius:6px;cursor:pointer;font-size:.82rem;margin-bottom:1.4rem;transition:color .15s,border-color .15s}
.back-btn:hover{color:var(--text);border-color:var(--accent)}

/* All-time champions */
.alltime-champs{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:2rem}
.champ-card{background:linear-gradient(135deg,#2a1f0a,#1a1208);border:1px solid var(--gold);border-radius:10px;padding:1rem 1.4rem;display:flex;align-items:center;gap:1rem}
.champ-rings{display:flex;gap:.25rem;flex-wrap:wrap}
.ring{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--gold);border-radius:50%;font-size:.72rem;font-weight:700;color:#1a0a00}
.champ-team{font-weight:700;color:var(--gold)}
.champ-years{color:var(--muted);font-size:.78rem}
.no-data{color:var(--muted);font-style:italic;padding:.75rem 0}

@media(max-width:768px){
  .content{padding:1rem}
  .quick-stats{grid-template-columns:repeat(2,1fr)}
  .highlights-grid,.bracket-grid{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
}
</style>
</head>

inal loss to gcmgazelle by less than three points is the kind of thing you don't talk about at Thanksgiving. Still — third place. That's not nothing. It's also not a championship.\n\nloganstahl71 was the league's second-highest scorer and made the semis. A solid season. The late trades were a mixed bag — Travis Kelce didn't save anyone — but getting there is half the battle.\n\n---\n\n## 💩 THE TOILET BOWL DISASTER: bmiller99\n\nTwelve teams. Two in the toilet bowl. One winner, one loser. bmiller99 lost to zshirk — ZSHIRK, the 2-12 team — 78.88 to 68.04. Let that sink in. You were the worst team in WAFFL 2025. You had a chance at redemption. And you got cooked by the guy who finished twelfth. Again. The season isn't over until the toilet flushes, and bmiller99 got flushed.\n\n---\n\n## 11TH PLACE ACKNOWLEDGMENT: zshirk\n\n2-12. Absolutely nothing worked all year. But zshirk won the Toilet Bowl, 78.88 to 68.04, which means technically he finished the season on a winning note. We're giving him this one. He earned it. He also dropped $14 on Brenton Strange in Week 1, so he's getting nothing else.\n\n---\n\n## TEAM-BY-TEAM ONE-LINERS\n\n- **smurphy2121**: Led the league in scoring, won the most games, lost in the semis by 2.62. There's a word for this. It's \"protagonist.\"\n- **loganstahl71**: Second-best scorer, made the semis, left a Travis Kelce-shaped hole in his late-season record. Solid season, unfortunate taste in pickups.\n- **jkrempa**: Quietly built, patiently waited, then robbed everyone in the playoffs. Your champion.\n- **gcmgazelle**: Won the offseason draft trade circuit, made the championship, scored 93 points when it mattered most. The vibes were there. The points weren't.\n- **stevenbaker58**: Paid $110 in FAAB, started Aaron Rodgers, and still went 9-5. Genuinely remarkable willpower.\n- **Winnie24**: Seventh in scoring, 7-7 record, and yet somehow the postseason winner of the Malik Nabers/Travis Hunter trade. Made the playoffs. Lost in the first roun tly the kind of quiet edge that turns a bridesmaid into a bride. The Downs Bros' 1.01 gamble on Saquon Barkley backfires hard enough that it becomes the year's cautionary tale, and Caleb Williams — the guy they didn't spend a first-rounder on — ends up being their best offensive player. And Mean Machines, one year removed from the league's best record and an inexplicable no-show in the playoffs, do it again: best record, first-round exit, same story."}, {"slug": "2026-06-15-how-to-post", "title": "How to Write a WAFFL Blog Post", "author": "cjlauer16", "date": "2026-06-15", "body": "Anyone in the league can write a blog post here. No coding knowledge required. This guide walks you through everything from creating an account to publishing your first post.\n\n---\n\n## Step 1: Create a GitHub Account\n\nGo to [github.com](https://github.com) and click **Sign up**. All you need is an email address. GitHub is free.\n\nOnce you have an account, send your GitHub username to Casey so he can add you as a collaborator on the repo.\n\n---\n\n## Step 2: Accept the Collaborator Invite\n\nAfter Casey adds you, GitHub will send you an email with a link to accept the invitation. Click it. If you can't find the email, log into GitHub and check [github.com/notifications](https://github.com/notifications).\n\nOnce accepted, you have write access and can post.\n\n---\n\n## Step 3: Go to the Blog Folder\n\nNavigate to [github.com/cjlauer16/waffl-history](https://github.com/cjlauer16/waffl-history) and click on the **blog** folder. You'll see existing posts listed as files.\n\n---\n\n## Step 4: Create a New File\n\nClick **Add file → Create new file** in the top right corner of the page.\n\nName your file using this format:\n\n```\nYYYY-MM-DD-your-post-title.md\n```\n\nFor example: `2026-09-01-i-got-lucky-and-ill-admit-it.md`\n\nRules for the filename:\n- Start with today's date (this controls sort order — newest shows first)\n- Use dashes instead of spaces\n- End with `.md`\n\n---\n\n## Step 5: Add the Header Block\n\nEvery post needs a small block at the very top. Copy and paste this, then fill it in:\n\n```\n---\ntitle: Your Post Title Here\nauthor: YourLeagueName\ndate: 2026-09-01\n---\n```\n\n- **title** — what shows up as the post heading and in the blog list\n- **author** — your league username or whatever name you want displayed\n- **date** — the date of the post (YYYY-MM-DD format)\n\nDon't change the dashes or colons. Everything in between the `---` lines is the header, and everything after the second `---` is your post body.\n\n---\n\n## Step 6: Write Your Post\n\nBelow the header block, just start writing. You don't need to know anything special — plain text works perfectly and will look good on the site.\n\n---\n\n## Step 7: Publish It\n\nScroll to the bottom of the page and click **Commit changes**. Leave the default message as-is and click **Commit changes** again in the popup that appears.\n\nYour post will be live on the site in about 60 seconds.\n\n---\n\n## Saving a Draft\n\nIf you're not ready to publish yet, add `draft: true` to your header block:\n\n```\n---\ntitle: Hot Take I'm Still Workshopping\nauthor: YourLeagueName\ndate: 2026-09-01\ndraft: true\n---\n```\n\nThe post will be saved to GitHub and you can come back to edit it later — but it won't appear on the site. When you're ready, edit the file, remove (or change) the `draft: true` line, and commit again.\n\n---\n\n## Editing an Existing Post\n\nClick on your file in the **blog** folder, then click the **pencil icon** (Edit this file) in the top right. Make your changes and click **Commit changes**. The site updates in about 60 seconds.\n\n---\n\n## Formatting Your Post\n\nPlain text is totally fine and will look good. But if you want to add formatting, here's the complete reference:\n\n### Text Styling\n\n| What you type | What it looks like |\n|---|---|\n| `**bold text**` | **bold text** |\n| `*italic text*` | *italic text* |\n| `~~strikethrough~~` | ~~strikethrough~~ |\n| `**_bold and italic_**` | ***bold and italic*** |\n\n### Headings\n\nPut one or more `#` signs before a line to make it a heading. More `#` signs = smaller heading.\n\n```\n# Big Heading\n## Medium Heading\n### Smaller Heading\n```\n\n### Lists\n\n**Bullet list** — put a `-` or `*` before each item:\n```\n- First item\n- Second item\n- Third item\n```\n\n**Numbered list** — put `1.`, `2.`, etc. before each item:\n```\n1. First item\n2. Second item\n3. Third item\n```\n\n### Quotes\n\nPut a `>` before a line to make it a blockquote:\n```\n> This is a quote or callout.\n```\n\n### Horizontal Rule (divider line)\n\nThree dashes on their own line:\n```\n---\n```\n\n### Links\n\n```\n[link text](https://example.com)\n```\n\n### Code / Monospace Text\n\nSurround inline text with backticks: `` `like this` ``\n\nFor a multi-line code block, use three backticks before and after:\n\n```\nyour code or text here\n```\n\n### Line Breaks\n\nIf you want a new paragraph, leave a blank line between your text. A single line break in the editor won't create a new paragraph — you need the blank line.\n\n---\n\n## Don't Want to Learn All That? Use a Visual Editor\n\nIf the formatting syntax looks annoying, you can write your post in a visual editor that works like Word or Google Docs — with actual buttons for bold, italic, headings, etc. — then copy and paste the result into GitHub.\n\n**[StackEdit.io](https://stackedit.io)** — Free, no account needed. Open it in a browser tab, write your post on the left side, see a preview on the right, then copy everything from the left side and paste it into GitHub's file editor.\n\nWrite there, paste here.\n\n---\n\nThat's everything. If something breaks or you can't figure out a step, text Casey."}];/*__BLOGS_END__*/

  let col=-1,dir=1;
  ths.forEach((th,i)=>{
    th.addEventListener('click',()=>{
      dir = col===i ? -dir : 1;
      col=i;
      ths.forEach(h=>h.classList.remove('sort-asc','sort-desc'));
      th.classList.add(dir===1?'sort-asc':'sort-desc');
      const tb=tbl.querySelector('tbody');
      [...tb.querySelectorAll('tr')].sort((a,b)=>{
        const av=a.cells[i]?.dataset.sort??a.cells[i]?.textContent??'';
        const bv=b.cells[i]?.dataset.sort??b.cells[i]?.textContent??'';
        const an=parseFloat(av),bn=parseFloat(bv);
        return !isNaN(an)&&!isNaN(bn) ? dir*(an-bn) : dir*av.localeCompare(bv);
      }).forEach(r=>tb.appendChild(r));
    });
  });
}

// ── Season rendering ─────────────────────────────────────────────────────────

function renderChampionBanner(s){
  const pr=s.playoff_results||{};
  if(!pr.champion) return '';
  // Find team name for champion from standings
  const champStanding=s.standings.find(t=>t.user_name===pr.champion);
  const champTeam=champStanding?champStanding.team_name:'';
  return `
  <div class="champion-banner">
    <div class="champion-trophy">🏆</div>
    <div>
      <div class="champion-label">${esc(s.year)} Champion</div>
      <div class="champion-name">${esc(pr.champion)}</div>
      ${champTeam?`<div style="color:var(--gold);opacity:.7;font-size:.95rem;margin-bottom:.3rem">${esc(champTeam)}</div>`:''}
      <div class="champion-sub">
        Runner-Up: <strong>${esc(pr.runner_up||'—')}</strong>
        &nbsp;·&nbsp; 3rd: <strong>${esc(pr.third_place||'—')}</strong>
        &nbsp;·&nbsp; Last Place: <strong style="color:var(--red)">${esc(pr.toilet_bowl_loser||'—')}</strong>
      </div>
    </div>
  </div>`;
}

function renderQuickStats(s){
  const ts=s.transaction_summary||{};
  const stands=s.standings||[];
  const totalPF=stands.reduce((a,t)=>a+(t.points_for||0),0);
  const weeks=s.playoff_week_start>1 ? s.playoff_week_start-1 : 14;
  const avgPF=stands.length ? (totalPF/stands.length/weeks).toFixed(1) : '—';
  return `
  <div class="quick-stats">
    <div class="stat-card">
      <div class="stat-label">Total Trades</div>
      <div class="stat-value">${ts.total_trades||0}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Roster Moves</div>
      <div class="stat-value">${ts.total_moves||0}</div>
      <div class="stat-sub">${ts.waiver_claims||0} waiver claims</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">FAAB Spent</div>
      <div class="stat-value">$${ts.total_faab_spent||0}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Pts / Team / Wk</div>
      <div class="stat-value">${avgPF}</div>
    </div>
  </div>`;
}

function renderStandings(s){
  const rows=(s.standings||[]).map((t,i)=>{
    const rec=`${t.wins}-${t.losses}${t.ties?'-'+t.ties:''}`;
    const diff=t.point_diff||0;
    const diffStr=(diff>=0?'+':'')+fmt(diff);
    const fc=finishClass(t.playoff_finish);
    const nameCell=`<span title="${esc(t.team_name)}">${esc(t.user_name)}</span>`
      +(t.team_name!==t.user_name?`<br><small style="color:var(--muted);font-size:.72rem">${esc(t.team_name)}</small>`:'');
    return `<tr>
      <td class="rank-cell">${i+1}</td>
      <td class="team-cell">${nameCell}</td>
      <td>${rec}</td>
      <td class="pf-pos" data-sort="${t.points_for}">${fmt(t.points_for)}</td>
      <td class="pf-neg" data-sort="${t.points_against}">${fmt(t.points_against)}</td>
      <td class="${diff>=0?'pf-pos':'pf-neg'}" data-sort="${diff}">${diffStr}</td>
      <td class="${fc}">${esc(t.playoff_finish||'—')}</td>
    </tr>`;
  }).join('');
  return `
  <div class="section">
    <div class="section-title">Final Standings</div>
    <table id="standings-${s.year}">
      <thead><tr>
        <th>#</th><th>Team</th><th>Record</th>
        <th>PF</th><th>PA</th><th>Diff</th><th>Finish</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderPlayoffResults(s){
  const pr=s.playoff_results||{};
  if(!pr.champion&&!pr.runner_up) return '';

  const bracket=[
    {icon:'🏆',label:'Champion',name:pr.champion},
    {icon:'🥈',label:'Runner-Up',name:pr.runner_up},
    {icon:'🥉',label:'3rd Place',name:pr.third_place},
    {icon:'  4',label:'4th Place',name:pr.fourth_place},
  ].filter(p=>p.name);

  const toilet=[
    {icon:'😤',label:'11th Place',name:pr.toilet_bowl_winner},
    {icon:'💩',label:'Last Place',name:pr.toilet_bowl_loser},
  ].filter(p=>p.name);

  const mkRows=arr=>arr.map(p=>`
    <div class="place-row">
      <span class="place-icon">${p.icon}</span>
      <span class="place-label">${esc(p.label)}</span>
      <span class="place-name">${esc(p.name)}</span>
    </div>`).join('');

  const toiletCard=toilet.length?`
    <div class="bracket-card">
      <div class="bracket-card-title">Toilet Bowl</div>
      ${mkRows(toilet)}
    </div>`:'';

  return `
  <div class="section">
    <div class="section-title">Playoff Results</div>
    <div class="bracket-grid">
      <div class="bracket-card">
        <div class="bracket-card-title">Championship Bracket</div>
        ${mkRows(bracket)}
      </div>
      ${toiletCard}
    </div>
  </div>`;
}

function renderManagerStats(s){
  const stats=s.manager_stats||[];
  if(!stats.length) return '';
  const rows=stats.map(m=>{
    const benchClass=m.avg_pts_left>15?'eff-bad':m.avg_pts_left<8?'eff-good':'';
    const effClass=m.efficiency_pct>=97?'eff-good':m.efficiency_pct<93?'eff-bad':'';
    const misClass=m.costly_mistakes===0?'mis-zero':m.costly_mistakes<=2?'mis-some':'mis-many';
    const nameCell=`<span title="${esc(m.team_name)}">${esc(m.user_name)}</span>`
      +(m.team_name!==m.user_name?`<br><small style="color:var(--muted);font-size:.72rem">${esc(m.team_name)}</small>`:'');
    return `<tr>
      <td class="team-cell">${nameCell}</td>
      <td>${m.trades}</td>
      <td>${m.total_moves}</td>
      <td>$${m.faab_spent}</td>
      <td class="${benchClass}" data-sort="${m.avg_pts_left}">${fmt(m.avg_pts_left,1)}</td>
      <td class="${effClass}" data-sort="${m.efficiency_pct}">${m.efficiency_pct}%</td>
      <td class="${misClass}">${m.costly_mistakes}</td>
    </tr>`;
  }).join('');
  return `
  <div class="section">
    <div class="section-title">Manager Performance</div>
    <table id="mgr-${s.year}">
      <thead><tr>
        <th>Team</th><th>Trades</th><th>Moves</th><th>FAAB</th>
        <th>Bench Pts/Wk</th><th>Lineup Eff%</th><th>Costly Mistakes</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="table-hint">Bench Pts/Wk = avg points left on bench vs optimal lineup each week &nbsp;·&nbsp;
    Costly Mistakes = regular-season losses where optimal lineup would have won</p>
  </div>`;
}

    cards.push(`<div class="highlight-card">

  if(h.closest_game){

    cards.push(`<div class="highlight-card">

function mdToHtml(text){
  // Escape raw HTML first so no injected tags survive
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = text.split('\n');
  let html = '';
  let inList = false;

  for(let i = 0; i < lines.length; i++){
    let line = lines[i];

    // Headings
    if(/^### /.test(line)){
      if(inList){ html += '</ul>'; inList=false; }
      html += `<h3>${e(line.slice(4))}</h3>`;
      continue;
    }
    if(/^## /.test(line)){
      if(inList){ html += '</ul>'; inList=false; }
      html += `<h2>${e(line.slice(3))}</h2>`;
      continue;
    }
    if(/^# /.test(line)){
      if(inList){ html += '</ul>'; inList=false; }
      html += `<h1>${e(line.slice(2))}</h1>`;
      continue;
    }

    // Bullet list items
    if(/^[-*] /.test(line)){
      if(!inList){ html += '<ul>'; inList=true; }
      const content = inlineFormat(e(line.slice(2)));
      html += `<li>${content}</li>`;
      continue;
    }

    // Numbered list items
    if(/^\d+\. /.test(line)){
      if(!inList){ html += '<ol>'; inList=true; }
      const content = inlineFormat(e(line.replace(/^\d+\. /,'')));
      html += `<li>${content}</li>`;
      continue;
    }

    // Close list on non-list line
    if(inList){ html += inList === 'ol' ? '</ol>' : '</ul>'; inList=false; }

    // Blank line = paragraph break
    if(line.trim() === ''){
      html += '<br>';
      continue;
    }

    // Horizontal rule
    if(/^---+$/.test(line.trim())){
      html += '<hr>';
      continue;
    }

    // Regular paragraph line
    html += `<p>${inlineFormat(e(line))}</p>`;
  }

  if(inList) html += '</ul>';
  return html;
}

function inlineFormat(s){
  // Bold+italic ***text***
  s = s.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
  // Bold **text**
  s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Italic *text*
  s = s.replace(/\*(.*?)\*/g, '<em>$1</em>');
  // Inline code `text`
  s = s.replace(/`(.*?)`/g, '<code>$1</code>');
  return s;
}

function renderSeason(s){
  return [
    renderChampionBanner(s),
    renderQuickStats(s),
    renderStandings(s),
    renderPlayoffResults(s),
    renderManagerStats(s),
    renderHighlights(s),
    renderAiRecap(s),
  ].join('');
}

// ── All-time rendering ───────────────────────────────────────────────────────

function renderAllTime(data){
  const at=data.all_time||{};
  const records=at.records||[];
  const seasons=at.season_champions||[];

  // Champion cards
  const champs=records.filter(r=>r.championships&&r.championships.length)
    .sort((a,b)=>b.championships.length-a.championships.length);

  const champCards=champs.length ? champs.map(t=>{
    const rings=t.championships.map(y=>`<span class="ring" title="${y}">${String(y).slice(2)}</span>`).join('');
    const hist=t.team_history||{};
    const histLabels=t.championships.map(y=>hist[y]||t.team).join(', ');
    return `<div class="champ-card">
      <div class="champ-rings">${rings}</div>
      <div><div class="champ-team">${esc(t.team)}</div>
      <div class="champ-years" title="${esc(histLabels)}">${t.championships.join(', ')}</div></div>
    </div>`;
  }).join('') : '<p class="no-data">No championships yet</p>';

  // All-time records table
  const recRows=records.map((r,i)=>{
    const wpct=(r.win_pct*100).toFixed(1)+'%';
    const ringStr=r.championships.length ? '🏆'.repeat(r.championships.length) : '—';
    const playoffs=r.playoff_count>0 ? `${r.playoff_count}x (${r.playoff_years.join(', ')})` : '0';
    // Build name history tooltip
    const hist=r.team_history||{};
    const histTip=Object.entries(hist).sort().map(([y,n])=>`${y}: ${n}`).join(' | ');
    const nameCell=r.user_name!==r.team
      ? `<span title="${esc(histTip)}">${esc(r.team)}</span><br><small style="color:var(--muted);font-size:.72rem">${esc(r.user_name)}</small>`
      : `<span title="${esc(histTip)}">${esc(r.team)}</span>`;
    return `<tr>
      <td class="rank-cell">${i+1}</td>
      <td class="team-cell">${nameCell}</td>
      <td>${r.wins}-${r.losses}</td>
      <td data-sort="${r.win_pct}">${wpct}</td>
      <td data-sort="${r.total_pf}">${Number(r.total_pf).toFixed(1)}</td>
      <td>${ringStr}</td>
      <td>${esc(playoffs)}</td>
    </tr>`;
  }).join('');

  // All-time weekly score records banner
  const wr=data.all_time.weekly_records||{};
  const wrHtml=`
  <div class="highlights-grid" style="margin-bottom:1.5rem">
    ${wr.high?`<div class="highlight-card">
      <div class="highlight-icon">🔥</div>
      <div class="highlight-type">All-Time High Score</div>
      <div class="highlight-main">${esc(wr.high.team)}</div>
      <div class="highlight-detail">${wr.high.year} Week ${wr.high.week} — <strong>${Number(wr.high.score).toFixed(2)} pts</strong></div>
    </div>`:''}
    ${wr.low?`<div class="highlight-card">
      <div class="highlight-icon">🥶</div>
      <div class="highlight-type">All-Time Low Score</div>
      <div class="highlight-main">${esc(wr.low.team)}</div>
      <div class="highlight-detail">${wr.low.year} Week ${wr.low.week} — <strong>${Number(wr.low.score).toFixed(2)} pts</strong></div>
    </div>`:''}
  </div>`;

  // Season-by-season summary with weekly records
  const sumRows=seasons.map(c=>{
    const h=c.high;
    const l=c.low;
    return `<tr>
      <td class="rank-cell">${c.year}</td>
      <td class="f-champ">${esc(c.champion||'TBD')}</td>
      <td class="f-runner">${esc(c.runner_up||'—')}</td>
      <td class="f-last">${esc(c.last_place||'—')}</td>
      <td>${h?`${esc(h.team)} (Wk ${h.week}, ${Number(h.score).toFixed(2)})`:'—'}</td>
      <td>${l?`${esc(l.team)} (Wk ${l.week}, ${Number(l.score).toFixed(2)})`:'—'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="section">
    <div class="section-title">Champions</div>
    <div class="alltime-champs">${champCards}</div>
  </div>
  <div class="section">
    <div class="section-title">All-Time Weekly Score Records</div>
    ${wrHtml}
  </div>
  <div class="section">
    <div class="section-title">All-Time Records (Regular Season)</div>
    <table id="at-records">
      <thead><tr>
        <th>#</th><th>Manager</th><th>Record</th><th>Win%</th>
        <th>Total PF</th><th>Championships</th><th>Playoff Appearances</th>
      </tr></thead>
      <tbody>${recRows}</tbody>
    </table>
  </div>
  <div class="section">
    <div class="section-title">Season-by-Season</div>
    <table id="at-seasons">
      <thead><tr>
        <th>Season</th><th>Champion</th><th>Runner-Up</th><th>Last Place</th>
        <th>High Score</th><th>Low Score</th>
      </tr></thead>
      <tbody>${sumRows}</tbody>
    </table>
  </div>`;
}

// ── Blog ─────────────────────────────────────────────────────────────────────

function renderBlogList(){
  if(!BLOGS.length){
    return '<div class="section"><p class="no-data">No blog posts yet.</p></div>';
  }
  const cards=BLOGS.map(b=>`
    <div class="blog-card" onclick="showBlogPost('${b.slug}')">
      <div class="blog-card-title">${esc(b.title)}</div>
      <div class="blog-card-meta">by <strong>${esc(b.author)}</strong>${b.date?' · '+esc(b.date):''}</div>
      <div class="blog-card-preview">${esc((b.body||'').slice(0,220))}${(b.body||'').length>220?'…':''}</div>
    </div>`).join('');
  return `<div class="section"><h2 class="section-title">League Blog</h2>${cards}</div>`;
}

function showBlogPost(slug){
  const b=BLOGS.find(b=>b.slug===slug);
  if(!b){document.getElementById('content').innerHTML='<div class="section"><p class="no-data">Post not found.</p></div>';return;}
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.key==='blogs'));
  document.getElementById('content').innerHTML=`
    <div class="section">
      <button class="back-btn" onclick="showTab('blogs')">← Back to Blog</button>
      <h1 class="blog-post-title">${esc(b.title)}</h1>
      <div class="blog-post-meta">by <strong>${esc(b.author)}</strong>${b.date?' · '+esc(b.date):''}</div>
      <div class="ai-text">${mdToHtml(b.body||'')}</div>
      <div id="giscus-comments" style="margin-top:2rem"></div>
    </div>`;
  loadGiscus(slug);
}

function loadGiscus(term){
  const container=document.getElementById('giscus-comments');
  if(!container) return;
  container.innerHTML='';
  const script=document.createElement('script');
  script.src='https://giscus.app/client.js';
  script.setAttribute('data-repo','cjlauer16/waffl-history');
  script.setAttribute('data-repo-id','R_kgDOS6sl6w');
  script.setAttribute('data-category','Announcements');
  script.setAttribute('data-category-id','DIC_kwDOS6sl684DE8WN');
  script.setAttribute('data-mapping','specific');
  script.setAttribute('data-term',term);
  script.setAttribute('data-strict','0');
  script.setAttribute('data-reactions-enabled','1');
  script.setAttribute('data-emit-metadata','0');
  script.setAttribute('data-input-position','top');
  script.setAttribute('data-theme','preferred_color_scheme');
  script.setAttribute('data-lang','en');
  script.setAttribute('crossorigin','anonymous');
  script.async=true;
  container.appendChild(script);
}

// ── App ───────────────────────────────────────────────────────────────────────

function showTab(key){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===String(key)));
  const content=document.getElementById('content');
  if(key==='alltime'){
    content.innerHTML=renderAllTime(DATA);
  } else if(key==='blogs'){
    content.innerHTML=renderBlogList();
  } else {
    const s=DATA.seasons.find(s=>s.year===Number(key));
    if(!s){content.innerHTML='<p class="no-data">Season not found</p>';return;}
    content.innerHTML=renderSeason(s);
  }
  content.querySelectorAll('table').forEach(t=>makeSortable(t));
}

document.addEventListener('DOMContentLoaded',()=>{
  const tabs=document.getElementById('tabs');
  DATA.seasons.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='tab-btn';
    btn.textContent=s.year;
    btn.dataset.key=s.year;
    btn.addEventListener('click',()=>showTab(s.year));
    tabs.appendChild(btn);
  });
  const allBtn=document.createElement('button');
  allBtn.className='tab-btn';
  allBtn.textContent='All-Time';
  allBtn.dataset.key='alltime';
  allBtn.addEventListener('click',()=>showTab('alltime'));
  tabs.appendChild(allBtn);
  const blogBtn=document.createElement('button');
  blogBtn.className='tab-btn';
  blogBtn.textContent='Blog';
  blogBtn.dataset.key='blogs';
  blogBtn.addEventListener('click',()=>showTab('blogs'));
  tabs.appendChild(blogBtn);

  // Default to most recent season
  if(DATA.seasons.length) showTab(DATA.seasons[DATA.seasons.length-1].year);
});
